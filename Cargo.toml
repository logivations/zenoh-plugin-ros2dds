[workspace]
members = ["zenoh-bridge-ros2dds", "zenoh-plugin-ros2dds"]
resolver = "2"

[workspace.package]
authors = ["Julien Enoch <julien@enoch.fr>"]
edition = "2021"
homepage = "http://zenoh.io"
license = "EPL-2.0 OR Apache-2.0"
repository = "https://github.com/eclipse-zenoh/zenoh-plugin-ros2dds"
version = "1.10.1"

[workspace.dependencies]
async-liveliness-monitor = "0.1.1"
async-trait = "0.1.66"
bincode = "1.3.3"
cdr = "0.2.4"
clap = "4.4.11"
cyclors = "0.4.0"
derivative = "2.2.0"
flume = "0.11.0"
futures = "0.3.26"
git-version = "0.3.5"
hex = "0.4.3"
lazy_static = "1.4.0"
regex = "1.7.1"
rustc_version = "0.4"
serde = "1.0.154"
serde_json = "1.0.114"
test-case = { version = "3.3.1" }
tokio = { version = "1.35.1", default-features = false } # Default features are disabled due to some crates' requirements
tracing = "0.1"
zenoh = { version = "=1.10.1", features = [
  "plugins",
  "unstable",
]}
zenoh-config = { version = "=1.10.1", default-features = false}
zenoh-ext = { version = "=1.10.1", features = [
  "unstable",
]}
zenoh-plugin-ros2dds = { version = "1.10.1", path = "zenoh-plugin-ros2dds/", default-features = false }
zenoh-plugin-rest = { version = "=1.10.1", default-features = false, features = [
  "static_plugin",
]}
zenoh-plugin-trait = { version = "=1.10.1", default-features = false}

[profile.release]
codegen-units = 1
debug = false
lto = "fat"
opt-level = 3
panic = "abort"

# TEMPORARY transport-fix pin (RTDTK-1026): the released zenoh 1.10.1 wedges under
# connection storms; this patches the full 28-crate zenoh workspace closure to
# logivations/zenoh branch `ros2dds/1.10.1-transport-fixes-v3` (tag `ros2dds-1.10.1-tf3`)
# = tag 1.10.1 + the #2709/#2829/#2830-class transport fixes (+ #2779, #2619, #2736).
# The umbrella deps above are pinned `=1.10.1` so a plain `cargo update` cannot move
# them off the patched version and silently drop this block (CI guards the lock too).
# REMOVAL: once an eclipse zenoh release ships the #2709/#2829/#2830-class fixes,
# delete this whole [patch.crates-io] block and relax the `=1.10.1` pins.
[patch.crates-io]
zenoh                      = { git = "https://github.com/logivations/zenoh.git", rev = "841836698b1a0e855c9a2c51ffc932aec8f68291" }
