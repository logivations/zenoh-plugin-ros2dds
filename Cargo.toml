zenoh-core = { git = "https://github.com/logivations/zenoh.git", rev = "d3e7e4aa23db20fb535cda66f24bf8d99ae3cda8" }
zenoh-crypto = { git = "https://github.com/logivations/zenoh.git", rev = "d3e7e4aa23db20fb535cda66f24bf8d99ae3cda8" }
