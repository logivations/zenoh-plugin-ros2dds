[package]
name = "zenoh-test-ros2dds"
edition = "2021"

[dependencies]
cdr = "0.2.4"
# same version as the plugin (unified by cargo), used by the W2 test to read
# the bridge's ros_discovery_info topic
cyclors = "0.4.0"
hex = "0.4.3"
futures = "0.3.26"
r2r = "0.9.5"
serde = "1.0.219"
serde_derive = "1.0.219"
serde_json = "1.0.142"
tokio = { version = "1.47.1", default-features = false } # Default features are disabled due to some crates' requirements
# Pinned to the released 1.10.1 (not zenoh git main): this fork's plugin is
# built against 1.10.1 and the harness must link the same zenoh.
# Before local tests run `python3 align_zenoh.py` (also run by CI) to inherit
# the release workspace patches and verify the resolved transport sources.
zenoh = { version = "=1.10.1", features = [
  "plugins",
  "unstable",
] }
zenoh-config = { version = "=1.10.1", default-features = false }
zenoh-plugin-ros2dds = { path = "../zenoh-plugin-ros2dds/", default-features = false }

# We need an empty workspace to avoid being viewed as a part of zenoh-plugin-ros2dds
[workspace]
